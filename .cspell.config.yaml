version: '0.2'
language: en
allowCompoundWords: true
caseSensitive: false
ignoreRandomStrings: true
words:
  - lerp
  - nargs
  - noshiro
  - nums
  - seti
  - synstate
  - testw
  - tscw
  - recomputations
  - unsub
  - valtio
ignorePaths:
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - dist/**
  - agents/common/**
  - packages/docs/public
